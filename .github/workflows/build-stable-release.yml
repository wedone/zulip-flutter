name: 构建稳定版客户端

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例如：30.0.272-for-math.1）'
        required: true
        default: '30.0.272-for-math.1'
        type: string
      branch:
        description: '构建分支'
        required: true
        default: 'math-fork'
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: 构建稳定版客户端
    runs-on: ubuntu-24.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}
        fetch-depth: 1

    - name: 配置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 克隆 Flutter SDK
      run: |
        echo "正在克隆 Flutter SDK..."
        ./tools/ci/clone-flutter-sdk

    - name: 下载 Flutter SDK 组件
      run: flutter precache --universal

    - name: 安装依赖
      run: flutter pub get

    - name: 启用 Android 平台
      run: flutter config --enable-android

    - name: 构建 Release APK
      run: flutter build apk --release

    - name: 重命名 APK 文件
      run: |
        VERSION=${{ github.event.inputs.version }}
        APK_DIR=build/app/outputs/flutter-apk
        LATEST_APK=$(ls $APK_DIR/app-*.apk | head -n 1)
        NEW_NAME="zulip-android-${VERSION}.apk"
        cp "$LATEST_APK" "$APK_DIR/$NEW_NAME"
        echo "已创建: $NEW_NAME"

    - name: 提取 Release Notes
      id: release_notes
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        # 从版本号中提取 math-vX.Y 部分，如 30.0.272-math-v1.4+5 → math-v1.4
        MATH_VERSION=$(echo "$VERSION" | grep -oP 'math-v\d+\.\d+')
        if [ -z "$MATH_VERSION" ]; then
          echo "❌ 无法从版本号 $VERSION 中提取 math 版本号"
          echo "notes=未找到对应版本的更新日志" >> $GITHUB_OUTPUT
          exit 0
        fi
        echo "提取到 math 版本号: $MATH_VERSION"

        # 从 CHANGELOG-MATH.md 中提取对应版本的内容
        # 匹配 ## math-vX.Y（日期）到下一个 ## 之间的内容
        NOTES=$(awk "/^## ${MATH_VERSION}（/,/^## /" CHANGELOG-MATH.md | head -n -1 | tail -n +2)
        if [ -z "$NOTES" ]; then
          echo "⚠️ 未在 CHANGELOG-MATH.md 中找到 ${MATH_VERSION} 的更新日志"
          echo "notes=未找到对应版本的更新日志" >> $GITHUB_OUTPUT
        else
          echo "✅ 成功提取 ${MATH_VERSION} 的更新日志"
          # 将多行内容写入文件，避免环境变量换行问题
          echo "$NOTES" > release_notes.txt
          echo "notes_file=release_notes.txt" >> $GITHUB_OUTPUT
        fi

    - name: 创建 GitHub Release 并上传 APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        body_path: ${{ steps.release_notes.outputs.notes_file }}
        files: build/app/outputs/flutter-apk/zulip-android-*.apk
        draft: false
        prerelease: false

    - name: 上传 APK 文件
      uses: actions/upload-artifact@v4
      with:
        name: zulip-stable-release
        path: build/app/outputs/flutter-apk/zulip-android-*.apk
        if-no-files-found: error
        retention-days: 90

    - name: 生成构建摘要
      run: |
        echo "## 📦 稳定版客户端构建" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 构建信息" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **版本**: ${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **分支**: ${{ github.event.inputs.branch }}" >> $GITHUB_STEP_SUMMARY
        echo "- **提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **构建时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "- **触发者**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 下载" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "请在下方 **Artifacts** 部分下载 APK 文件。" >> $GITHUB_STEP_SUMMARY
