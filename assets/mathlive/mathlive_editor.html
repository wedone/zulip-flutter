<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <!-- 本地 asset：不再依赖 CDN，baseUrl 由 Dart 端 loadHtmlString 指定 -->
  <link rel="stylesheet" href="mathlive-static.css" />
  <script src="mathlive.min.js"></script>
  <style>
    /* 非全屏布局：高度由 math-field + 虚拟键盘决定 */
    html, body {
      margin: 0;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      background: #ffffff;
      font-family: system-ui, sans-serif;
    }
    .mathlive-mixed-root {
      margin: 0;
      width: 100%;
      background: #ffffff;
      box-sizing: border-box;
    }
    /* math-field 编辑区 */
    #editor-shell {
      box-sizing: border-box;
      padding: 8px 12px;
      padding-top: max(8px, env(safe-area-inset-top, 0px));
      padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
    }
    math-field {
      width: 100%;
      min-height: 80px;
      font-size: 24px;
      border: none;
      outline: none;
      border-bottom: 1px solid #e2e8f0;
      padding: 8px 4px;
      box-sizing: border-box;
    }
    math-field:focus-within {
      border-bottom-color: #0d80f2;
    }
    /*
     * 隐藏 math-field 菜单切换按钮和虚拟键盘切换按钮
     * （我们用自定义布局，不需要原生 toolbar）
     */
    math-field::part(menu-toggle),
    math-field::part(virtual-keyboard-toggle) {
      display: none !important;
    }
    /* 虚拟键盘顶部与 math-field 底部无缝连接 */
    body > .ML__keyboard.is-visible > .MLK__backdrop {
      box-shadow: none;
      border-top: none;
    }
    /* 暗色主题 */
    .mathlive-mixed-root.theme-dark { background: #141922; }
    body.theme-dark { background: #141922; }
    .mathlive-mixed-root.theme-dark math-field,
    body.theme-dark math-field {
      color: #e2e8f0;
      border-bottom-color: #334155;
    }
    /* 移动端按键尺寸 */
    @media (pointer: coarse) {
      body {
        --keycap-height: 42px;
        --keycap-width: min(52px, 10vw);
        --keycap-max-width: 60px;
        --keycap-font-size: 17px;
        --keycap-shift-font-size: 10px;
        --keycap-small-font-size: 11px;
        --keyboard-toolbar-font-size: 15px;
        --keycap-gap: 4px;
        --keyboard-padding-horizontal: 2px;
      }
      math-field { font-size: 24px; }
    }
    /*
     * Keep MathLive's popup menu + its "Insert" submenu fully inside narrow
     * iOS viewports. Without these caps the submenu expands to the right of
     * the parent menu and gets clipped by the screen edge on compact widths.
     */
    .ML__menu,
    .ui-menu-container,
    ui-menu-container,
    ui-submenu,
    [role="menu"] {
      max-width: calc(100vw - 16px) !important;
      max-height: calc(100vh - 16px) !important;
      overflow: auto !important;
      box-sizing: border-box !important;
    }
    .ML__menu [role="menuitem"],
    .ui-menu-container [role="menuitem"],
    ui-menu-container [role="menuitem"],
    [role="menu"] [role="menuitem"] {
      white-space: normal !important;
      word-break: break-word !important;
    }
  </style>
</head>
<body>
<div class="mathlive-mixed-root" id="MATHLIVE_MIXED_ROOT_ID">
  <div id="editor-shell">
    <math-field id="mf" math-mode-space="\ " virtual-keyboard-mode="manual"></math-field>
  </div>
</div>
<script>
  /* mathlive 0.110.0 音效路径：必须用绝对路径，否则 resolveUrl 会基于 mathlive.min.js 的 URL 解析 */
  if (typeof MathfieldElement !== 'undefined') {
    try {
      MathfieldElement.soundsDirectory = new URL('./sounds', document.baseURI).href;
    } catch (eSound) {}
  }

  /* ==================== JS Bridge 通信逻辑（保留 v1） ==================== */

  function mlMixedPostToHost(s) {
    var str = String(s == null ? '' : s);
    try {
      if (typeof FlutterLatexSync !== 'undefined' && FlutterLatexSync.postMessage) {
        FlutterLatexSync.postMessage(str);
        return;
      }
    } catch (eSync) {}
    try {
      if (typeof FlutterLatex !== 'undefined' && FlutterLatex.postMessage) {
        FlutterLatex.postMessage(str);
        return;
      }
    } catch (e1) {}
    try {
      var latexPayload = { channel: 'MathLiveMixed', latex: str, clientId: '___MATHLIVE_MIXED_CLIENT___' };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(latexPayload, '*');
      } else {
        window.postMessage(latexPayload, '*');
      }
    } catch (e2) {}
  }

  function mlMixedExportLatex() {
    try {
      var mf = document.getElementById('mf');
      if (!mf) { mlMixedPostToHost(''); return; }
      var s = (typeof mf.getValue === 'function') ? String(mf.getValue('latex') || '') : '';
      mlMixedPostToHost(s);
    } catch (e) {
      mlMixedPostToHost('');
    }
  }

  function mlMixedSetLatex(latex) {
    var s = String(latex == null ? '' : latex);
    function tryApply() {
      try {
        var mf = document.getElementById('mf');
        if (!mf) return false;
        if (typeof mf.setValue === 'function') {
          mf.setValue(s, { format: 'latex' });
        } else if ('value' in mf) {
          mf.value = s;
        } else {
          return false;
        }
        try { mf.focus(); } catch (e2) {}
        return true;
      } catch (e) {
        return false;
      }
    }
    function scheduleRetries() {
      tryApply();
      setTimeout(tryApply, 0);
      setTimeout(tryApply, 80);
      setTimeout(tryApply, 250);
      setTimeout(tryApply, 600);
    }
    /* Immediate retries (legacy) + wait for `math-field` when Dart runs before MathLive loads */
    scheduleRetries();
    if (typeof customElements !== 'undefined' && customElements.whenDefined) {
      customElements.whenDefined('math-field').then(scheduleRetries).catch(scheduleRetries);
    }
  }

  function mlMixedSetTheme(dark) {
    var root = document.getElementById('MATHLIVE_MIXED_ROOT_ID');
    if (root) {
      root.classList.toggle('theme-dark', !!dark);
    } else {
      document.body.classList.toggle('theme-dark', !!dark);
    }
  }

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.channel !== 'MathLiveMixedHost') return;
    if (d.clientId !== '___MATHLIVE_MIXED_CLIENT___') return;
    if (d.cmd === 'export') { mlMixedExportLatex(); return; }
    if (d.cmd === 'theme') { mlMixedSetTheme(!!d.dark); return; }
    if (d.cmd === 'setLatex') { mlMixedSetLatex(d.latex); return; }
  });

  /** True when this document is inside an iframe (e.g. Flutter web HtmlElementView). */
  function mlMixedIsInIframe() {
    try {
      return window.parent !== window;
    } catch (e) {
      return true;
    }
  }

  function mlMixedNotifyHostChromeHeight() {
    try {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          try {
            var root = document.getElementById('MATHLIVE_MIXED_ROOT_ID');
            var h = 0;
            if (root) {
              h = Math.ceil(root.scrollHeight);
            } else {
              var b = document.body;
              var el = document.documentElement;
              h = Math.ceil(Math.max(
                b ? b.scrollHeight : 0,
                b ? b.offsetHeight : 0,
                el ? el.scrollHeight : 0,
                el ? el.offsetHeight : 0
              ));
            }
            /* 加上虚拟键盘的高度（如果可见） */
            try {
              if (typeof mathVirtualKeyboard !== 'undefined' && mathVirtualKeyboard.visible) {
                var kh = 0;
                try { kh = mathVirtualKeyboard.boundingRect.height || 0; } catch (eVk2) {}
                if (kh > 0) h += kh;
              }
            } catch (eVk) {}
            if (h < 80) h = 80;
            var payload = { channel: 'MathLiveMixed', editorHeight: h, clientId: '___MATHLIVE_MIXED_CLIENT___' };
            if (window.parent && window.parent !== window) {
              window.parent.postMessage(payload, '*');
            } else {
              window.postMessage(payload, '*');
            }
          } catch (e) {}
        });
      });
    } catch (e2) {}
  }

  /* 粘贴文本：Dart 端通过 runJavaScript('mlMixedPasteText(...)') 调用 */
  function mlMixedPasteText(text) {
    try {
      var mf = document.getElementById('mf');
      if (!mf) return;
      var s = String(text == null ? '' : text);
      if (typeof mf.insert === 'function') {
        mf.insert(s, { focus: true });
      } else if (typeof mf.executeCommand === 'function') {
        mf.executeCommand(['insert', s]);
      }
    } catch (e) {}
  }

  /* ==================== 自定义虚拟键盘布局（v2 新增） ==================== */

  function mlMixedAttachVirtualKeyboard() {
    if (typeof mathVirtualKeyboard === 'undefined') return;

    var mf = document.getElementById('mf');
    if (mf) {
      mf.mathVirtualKeyboardPolicy = 'manual';
    }

    /* 三个 layout：基本/符号/希腊，每个 layout 含 fixedRows 固定底部行 */
    mathVirtualKeyboard.layouts = [
      {
        label: '基本',
        layers: [
          {
            rows: [
              ['[7]', '[8]', '[9]', '[+]', { class: 'separator', width: 0.5 },
                { class: 'small', latex: '\\frac{#@}{#?}' }, '\\varnothing', '\\infty', '\\in', '\\notin'],
              ['[4]', '[5]', '[6]', '[-]', { class: 'separator', width: 0.5 },
                '[(]', '[)]', '\\lt', '\\le', '\\hat{=}'],
              ['[1]', '[2]', '[3]', '\\cdot', { class: 'separator', width: 0.5 },
                '[', ']', '\\gt', '\\ne', '\\ge'],
              [{ label: '[0]', width: 2 }, '[.]', '\\colon', { class: 'separator', width: 0.5 },
                '\\lbrace', '\\rbrace', '=', '\\ne'],
              ['\\alpha', '\\beta', '\\gamma', '\\delta', { class: 'separator', width: 0.5 },
                '\\sum', '\\prod', '\\int', '\\oint'],
              ['\\sin', '\\cos', '\\tan', '\\log', { class: 'separator', width: 0.5 },
                '\\lim', '\\infty', '\\partial', '\\nabla'],
            ],
            fixedRows: [
              ['[left]', '[right]', '[backspace]', { class: 'separator', width: 0.5 },
                '[-]', '[+]', '[=]', '[.]',
                { label: '完成', width: 1.5, class: 'action', command: 'ml-mixed-complete' }],
            ],
          },
        ],
      },
      {
        label: '符号',
        layers: [
          {
            rows: [
              ['\\pm', '\\mp', '\\times', '\\div', '\\cdot', '\\ast', '\\star', '\\circ'],
              ['\\cap', '\\cup', '\\wedge', '\\vee', '\\oplus', '\\otimes', '\\ominus', '\\oslash'],
              ['\\subseteq', '\\supseteq', '\\subset', '\\supset', '\\in', '\\notin', '\\ni', '\\emptyset'],
              ['\\rightarrow', '\\leftarrow', '\\Rightarrow', '\\Leftarrow', '\\mapsto', '\\longmapsto', '\\implies', '\\iff'],
              ['\\approx', '\\simeq', '\\cong', '\\equiv', '\\propto', '\\sim', '\\models', '\\dashv'],
              ['\\forall', '\\exists', '\\nexists', '\\neg', '\\top', '\\bot', '\\vdash', '\\vDash'],
            ],
            fixedRows: [
              ['[left]', '[right]', '[backspace]', { class: 'separator', width: 0.5 },
                '[-]', '[+]', '[=]', '[.]',
                { label: '完成', width: 1.5, class: 'action', command: 'ml-mixed-complete' }],
            ],
          },
        ],
      },
      {
        label: '希腊',
        layers: [
          {
            rows: [
              ['\\alpha', '\\beta', '\\gamma', '\\delta', '\\epsilon', '\\zeta', '\\eta', '\\theta'],
              ['\\iota', '\\kappa', '\\lambda', '\\mu', '\\nu', '\\xi', '\\omicron', '\\pi'],
              ['\\rho', '\\sigma', '\\tau', '\\upsilon', '\\phi', '\\chi', '\\psi', '\\omega'],
              ['\\Gamma', '\\Delta', '\\Theta', '\\Lambda', '\\Xi', '\\Pi', '\\Sigma', '\\Phi'],
              ['\\Psi', '\\Omega', '\\varpi', '\\varrho', '\\varsigma', '\\varphi', '\\aleph', '\\hbar'],
            ],
            fixedRows: [
              ['[left]', '[right]', '[backspace]', { class: 'separator', width: 0.5 },
                '[-]', '[+]', '[=]', '[.]',
                { label: '完成', width: 1.5, class: 'action', command: 'ml-mixed-complete' }],
            ],
          },
        ],
      },
    ];

    /* 监听键盘几何变化，通知 Flutter 端更新高度 */
    try {
      mathVirtualKeyboard.addEventListener('geometrychange', function () {
        mlMixedNotifyHostChromeHeight();
      });
    } catch (e) {}

    mlMixedNotifyHostChromeHeight();
  }

  /* ==================== 特殊键处理（保留 v1 的 mlMixedFixKeys） ==================== */

  function mlMixedEventTargetsMathField(ev, mf) {
    if (!mf) return false;
    if (ev.target === mf || mf.contains(ev.target)) return true;
    if (mf.shadowRoot && ev.target && mf.shadowRoot.contains(ev.target)) return true;
    if (typeof ev.composedPath === 'function') {
      var path = ev.composedPath();
      for (var i = 0; i < path.length; i++) {
        if (path[i] === mf) return true;
      }
    }
    return false;
  }

  function mlMixedEnsureMathModeSpace() {
    var mf = document.getElementById('mf');
    if (!mf) return;
    try {
      mf.setAttribute('math-mode-space', '\\ ');
    } catch (e) {}
  }

  var mlMixedSpaceInsertLockUntil = 0;
  function mlMixedInsertLatexSpace(mf) {
    var now = typeof performance !== 'undefined' && performance.now
      ? performance.now()
      : Date.now();
    if (now < mlMixedSpaceInsertLockUntil) {
      return;
    }
    mlMixedSpaceInsertLockUntil = now + 120;
    try {
      if (typeof mf.executeCommand === 'function') {
        try {
          mf.executeCommand(['insert', '\\ ', { format: 'latex' }]);
        } catch (e1) {
          try {
            mf.executeCommand(['insert', '\\ ']);
          } catch (e2) {
            mf.executeCommand('insert', '\\ ');
          }
        }
      } else if (typeof mf.insert === 'function') {
        mf.insert('\\ ', { format: 'latex' });
      }
    } catch (e3) {}
  }

  function mlMixedFixKeys() {
    var mf = document.getElementById('mf');
    if (!mf || mf.dataset.mlMixedKeyFix === '1') return;

    mf.dataset.mlMixedKeyFix = '1';

    mlMixedEnsureMathModeSpace();

    /* Enter 键插入换行 */
    mf.addEventListener(
      'keydown',
      function (ev) {
        if (!mlMixedEventTargetsMathField(ev, mf)) return;
        if (ev.key !== 'Enter') return;
        ev.preventDefault();
        ev.stopPropagation();

        try {
          mf.executeCommand('addRowAfter');
        } catch (e1) {
          try {
            mf.insert('\\newline ', { format: 'latex' });
          } catch (e2) {}
        }
      },
      true
    );

    /* 空格键插入 \+空格 */
    mf.addEventListener(
      'keydown',
      function (ev) {
        if (!mlMixedEventTargetsMathField(ev, mf)) return;
        if (ev.key !== ' ' && ev.code !== 'Space') return;
        try {
          ev.preventDefault();
        } catch (e0) {}
        try {
          ev.stopImmediatePropagation();
        } catch (e1) {}
        ev.stopPropagation();
        mlMixedInsertLatexSpace(mf);
      },
      true
    );

    mf.addEventListener(
      'beforeinput',
      function (ev) {
        if (ev.inputType !== 'insertText' || ev.data !== ' ') return;
        if (!mlMixedEventTargetsMathField(ev, mf)) return;
        try {
          ev.preventDefault();
        } catch (e2) {}
        ev.stopPropagation();
        mlMixedInsertLatexSpace(mf);
      },
      true
    );
  }

  /* ==================== 「完成」按钮处理（v2 新增） ==================== */

  /* 通知 Flutter 端：用户点击了「完成」按钮，导出 LaTeX 并请求关闭面板 */
  function mlMixedPostActionComplete() {
    /* 1. 通过 postMessage 发送（web 平台） */
    try {
      var payload = { channel: 'MathLiveMixed', action: 'complete', clientId: '___MATHLIVE_MIXED_CLIENT___' };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      } else {
        window.postMessage(payload, '*');
      }
    } catch (e) {}

    /* 2. 通过 JavaScript channel 发送（mobile 平台） */
    /* 使用特殊标记字符串 __ACTION_COMPLETE__，Dart 端检测此字符串触发关闭 */
    /* __ACTION_COMPLETE__ 不可能是有效的 LaTeX 内容，所以不会与正常的 latex 同步冲突 */
    try {
      if (typeof FlutterLatexSync !== 'undefined' && FlutterLatexSync.postMessage) {
        FlutterLatexSync.postMessage('__ACTION_COMPLETE__');
        return;
      }
    } catch (eSync) {}
    try {
      if (typeof FlutterLatex !== 'undefined' && FlutterLatex.postMessage) {
        FlutterLatex.postMessage('__ACTION_COMPLETE__');
        return;
      }
    } catch (e1) {}
  }

  function mlMixedActionComplete() {
    /* 1. 先导出 LaTeX（通过 FlutterLatexSync/FlutterLatex/postMessage 通道） */
    mlMixedExportLatex();
    /* 2. 再发送「完成」信号，通知 Flutter 端关闭面板 */
    mlMixedPostActionComplete();
  }

  /*
   * 拦截「完成」按键的 executeCommand。
   * keycap 的 command 是 'ml-mixed-complete'，MathLive 内部会通过 parseCommand
   * 将 kebab-case 转换为 camelCase，最终调用 mf.executeCommand('mlMixedComplete')。
   * 我们重写 mf.executeCommand 来拦截这个命令，避免触发 MathLive 的
   * "Unknown command" 错误。
   */
  function mlMixedSetupActionKey() {
    var mf = document.getElementById('mf');
    if (!mf || mf.dataset.mlMixedActionSetup === '1') return;
    mf.dataset.mlMixedActionSetup = '1';

    try {
      var origExecute = mf.executeCommand.bind(mf);
      mf.executeCommand = function (cmd) {
        /* 处理两种形式：字符串 'mlMixedComplete' 或数组 ['mlMixedComplete', ...] */
        var selector = cmd;
        if (Array.isArray(cmd)) {
          selector = cmd[0];
        } else if (typeof cmd === 'string') {
          /* 处理 'performWithFeedback(mlMixedComplete)' 形式 */
          var match = cmd.match(/^performWithFeedback\((.+)\)$/);
          if (match) {
            selector = match[1];
          }
        }
        if (selector === 'mlMixedComplete' || selector === 'ml-mixed-complete') {
          mlMixedActionComplete();
          return false;
        }
        return origExecute.apply(this, arguments);
      };
    } catch (e) {}
  }

  /* ==================== 初始化 ==================== */

  (function init() {
    mlMixedEnsureMathModeSpace();
    mlMixedAttachVirtualKeyboard();
    mlMixedFixKeys();
    setTimeout(mlMixedNotifyHostChromeHeight, 0);
    setTimeout(mlMixedNotifyHostChromeHeight, 200);

    if (typeof customElements !== 'undefined' && customElements.whenDefined) {
      customElements.whenDefined('math-field').then(function () {
        mlMixedEnsureMathModeSpace();
        mlMixedAttachVirtualKeyboard();
        mlMixedFixKeys();
        mlMixedSetupActionKey();
        /* 显示虚拟键盘（manual policy 下需要手动 show） */
        try {
          if (typeof mathVirtualKeyboard !== 'undefined') {
            mathVirtualKeyboard.show();
          }
        } catch (e) {}
        /* 通知 Flutter 端高度 */
        setTimeout(mlMixedNotifyHostChromeHeight, 0);
        setTimeout(mlMixedNotifyHostChromeHeight, 200);
        setTimeout(mlMixedNotifyHostChromeHeight, 500);
      }).catch(function () {});
    }

    /* 兜底重试 */
    setTimeout(mlMixedEnsureMathModeSpace, 0);
    setTimeout(mlMixedAttachVirtualKeyboard, 50);
    setTimeout(mlMixedAttachVirtualKeyboard, 300);
    setTimeout(mlMixedFixKeys, 50);
    setTimeout(mlMixedSetupActionKey, 100);
    setTimeout(function () { try { if (typeof mathVirtualKeyboard !== 'undefined') mathVirtualKeyboard.show(); } catch (e) {} }, 200);
  })();
</script>
</body>
</html>
